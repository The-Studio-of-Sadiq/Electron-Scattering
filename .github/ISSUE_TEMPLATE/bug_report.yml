name: Bug Report
description: Report an issue or unexpected error in the simulator
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please fill out the form below to help us reproduce and fix the bug.

  - type: input
    id: version
    attributes:
      label: Application Version
      description: Which version or git commit SHA of Electron Scattering Simulator are you running?
      placeholder: "e.g., 2.0.0, commit 2832f21"
    validations:
      required: true

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution Mode
      description: How is the application running?
      options:
        - "Browser-only WebAssembly (static site / PWA)"
        - "Local Express server with native gfortran (http://localhost:3000)"
        - "Docker container deployment"
        - "TS Approximation (demo model in browser)"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating System and Web Browser
      description: Provide your operating system and web browser version.
      placeholder: "e.g., Windows 11 / Chrome 122.0, macOS 14 / Safari 17.3"
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Describe the steps required to trigger the bug.
      placeholder: |
        1. Open the Atomic Workbench.
        2. Set Target Element to Au (Z = 79) and Energy to 1000 eV.
        3. Enable Buckingham correlation-polarization.
        4. Click Calculate.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually occurred? Include error banners or abnormal behavior.
    validations:
      required: true

  - type: textarea
    id: parameters_or_input_deck
    attributes:
      label: Input Parameters or Exported Deck
      description: Paste the exported ELSCATA input deck (.in file) or parameter values if applicable.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Error Logs and Console Output
      description: Paste browser developer console output (F12 -> Console) or server terminal logs.
      render: shell
