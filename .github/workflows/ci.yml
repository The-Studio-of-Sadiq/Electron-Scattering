name: CI

# Fast checks on every pull request and on main. The ~30-minute ELSEPA engine
# suite (elsepa-parity.yml) runs only when engine-related files change.
# Branch protection requires the single "CI result" check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter lists changed files through the API

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build app and server
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  changes:
    name: Detect engine changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine:
              - 'fortran/**'
              - 'data/**'
              - 'public/elsepa/**'
              - 'server/**'
              - 'server.ts'
              - 'src/physics/**'
              - 'src/utils/localApiFallback.ts'
              - 'validations/**'
              - 'wasm/**'
              - 'package-lock.json'
              - '.github/workflows/elsepa-parity.yml'

  engine:
    name: ELSEPA engine
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/elsepa-parity.yml

  result:
    name: CI result
    if: always()
    needs: [build, docker, changes, engine]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All jobs passed, or were skipped as not applicable."
