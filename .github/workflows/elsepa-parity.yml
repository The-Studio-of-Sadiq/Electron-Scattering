name: ELSEPA WebAssembly parity

# Checks that the in-browser WebAssembly ELSEPA (public/elsepa) reproduces
# native gfortran ELSEPA, including correlation-polarization and absorption
# cases, and that both match the reference tables in validations/.
on:
  push:
    paths:
      - 'fortran/**'
      - 'server/**'
      - 'src/physics/**'
      - 'data/**'
      - 'public/elsepa/**'
      - 'validations/**'
      - 'wasm/**'
      - '.github/workflows/elsepa-parity.yml'
  pull_request:
    paths:
      - 'fortran/**'
      - 'server/**'
      - 'src/physics/**'
      - 'data/**'
      - 'public/elsepa/**'
      - 'validations/**'
      - 'wasm/**'
      - '.github/workflows/elsepa-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The server test imports the Express app and the browser test builds the site with Vite.
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran

      - name: Build native ELSEPA (same flags as the Dockerfile)
        run: |
          mkdir -p native
          gfortran -O2 -Ifortran -o native/elscata fortran/elscata.f
          gfortran -O2 -Ifortran -o native/elscatm fortran/elscatm.f

      - name: Compare WebAssembly with gfortran and validations
        env:
          NATIVE_ELSCATA: ${{ github.workspace }}/native/elscata
          NATIVE_ELSCATM: ${{ github.workspace }}/native/elscatm
        run: npx --yes tsx@4.21.0 wasm/parity.test.ts

      - name: Unit and feature tests for custom energy grids and user-supplied density
        run: npx --yes tsx@4.21.0 wasm/features.test.ts

      - name: Server engine runs native ELSEPA, never the TypeScript model
        run: npx --yes tsx@4.21.0 wasm/server.test.ts

      - name: App reads every ELSEPA output; every model option reaches ELSEPA
        run: npx --yes tsx@4.21.0 wasm/outputs.test.ts

      - name: Benchmark WebAssembly against native gfortran
        env:
          NATIVE_ELSCATA: ${{ github.workspace }}/native/elscata
          NATIVE_ELSCATM: ${{ github.workspace }}/native/elscatm
          BENCH_RUNS: 3
        run: npx --yes tsx@4.21.0 wasm/benchmark.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Browser-only and offline operation test with real browser benchmark
        # pipefail: a failing test must fail the step even though its output goes through tee.
        run: |
          set -o pipefail
          npx --yes tsx@4.21.0 wasm/browser.test.ts | tee -a "$GITHUB_STEP_SUMMARY"

  references:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran

      - name: Build native ELSEPA
        run: |
          mkdir -p native
          gfortran -O2 -Ifortran -o native/elscata fortran/elscata.f
          gfortran -O2 -Ifortran -o native/elscatm fortran/elscatm.f

      - name: Regenerate reference tables
        env:
          NATIVE_ELSCATA: ${{ github.workspace }}/native/elscata
          NATIVE_ELSCATM: ${{ github.workspace }}/native/elscatm
        run: npx --yes tsx@4.21.0 wasm/make-references.ts

      - name: Upload validations artifact
        uses: actions/upload-artifact@v4
        with:
          name: validations-2021
          path: validations/
