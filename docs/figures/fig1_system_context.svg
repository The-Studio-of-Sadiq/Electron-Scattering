<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="750.0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">Electron Scattering Simulator v1.2: system context</text><rect x="30" y="380" width="270" height="230" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="48" y="414" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#0f172a">Researcher / student</text><circle cx="54" cy="446" r="3.5" fill="#334155"/><text x="66" y="452" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Chooses target, projectile,</text><text x="66" y="480" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">energy and models</text><circle cx="54" cy="502" r="3.5" fill="#334155"/><text x="66" y="508" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Runs and compares</text><text x="66" y="536" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">calculations</text><circle cx="54" cy="558" r="3.5" fill="#334155"/><text x="66" y="564" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Uploads measured data</text><rect x="370" y="90" width="660" height="640" rx="12" fill="#f8fbff" stroke="#2563eb" stroke-width="2.5"/><text x="388" y="124" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#1d4ed8">Web browser (installable PWA)</text><rect x="400" y="150" width="600" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="418" y="184" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#1d4ed8">React user interface</text><circle cx="424" cy="216" r="3.5" fill="#2563eb"/><text x="436" y="222" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Atomic and molecular workbenches, energy sweep</text><circle cx="424" cy="244" r="3.5" fill="#2563eb"/><text x="436" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Saved-run comparison, data overlay, exports</text><rect x="400" y="310" width="285" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="418" y="344" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#1d4ed8">API router</text><circle cx="424" cy="376" r="3.5" fill="#2563eb"/><text x="436" y="382" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Server ELSEPA if present</text><circle cx="424" cy="404" r="3.5" fill="#2563eb"/><text x="436" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Otherwise, or on a server</text><text x="436" y="438" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">error: in-browser engine</text><rect x="715" y="310" width="285" height="190" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="733" y="344" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#047857">ELSEPA engine</text><circle cx="739" cy="376" r="3.5" fill="#059669"/><text x="751" y="382" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Official Fortran 77,</text><text x="751" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">compiled to WebAssembly</text><circle cx="739" cy="432" r="3.5" fill="#059669"/><text x="751" y="438" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Runs in a Web Worker</text><circle cx="739" cy="460" r="3.5" fill="#059669"/><text x="751" y="466" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">206 data tables bundled</text><rect x="400" y="530" width="285" height="170" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="418" y="564" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#6d28d9">Browser storage</text><circle cx="424" cy="596" r="3.5" fill="#7c3aed"/><text x="436" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Saved runs (localStorage)</text><circle cx="424" cy="624" r="3.5" fill="#7c3aed"/><text x="436" y="630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Offline cache</text><text x="436" y="658" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">(service worker)</text><rect x="715" y="530" width="285" height="170" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="10 7"/><text x="733" y="564" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#374151">TS approximation</text><circle cx="739" cy="596" r="3.5" fill="#6b7280"/><text x="751" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Opt-in demo model</text><circle cx="739" cy="624" r="3.5" fill="#6b7280"/><text x="751" y="630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Not ELSEPA; results</text><text x="751" y="658" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">flagged approximate</text><path d="M685,405 L713,405" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><path d="M560,500 L560,528" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1110" y="90" width="360" height="170" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="1128" y="124" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#0f172a">Web host</text><circle cx="1134" cy="156" r="3.5" fill="#334155"/><text x="1146" y="162" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Render.com, or any</text><text x="1146" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">static host</text><circle cx="1134" cy="212" r="3.5" fill="#334155"/><text x="1146" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Serves app, engine, data</text><rect x="1110" y="320" width="360" height="230" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="10 7"/><text x="1128" y="354" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#b45309">Optional server</text><circle cx="1134" cy="386" r="3.5" fill="#d97706"/><text x="1146" y="392" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Node.js + Express</text><circle cx="1134" cy="414" r="3.5" fill="#d97706"/><text x="1146" y="420" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Native ELSEPA (gfortran),</text><text x="1146" y="448" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">same Fortran source</text><circle cx="1134" cy="470" r="3.5" fill="#d97706"/><text x="1146" y="476" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Returns errors, never</text><text x="1146" y="504" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">approximations</text><rect x="1110" y="610" width="360" height="160" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="1128" y="644" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#6d28d9">Reference and lab data</text><circle cx="1134" cy="676" r="3.5" fill="#7c3aed"/><text x="1146" y="682" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">NIST SRD 64, literature,</text><text x="1146" y="710" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">measurements (.csv, .dat)</text><rect x="370" y="800" width="660" height="160" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/><text x="388" y="834" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#b91c1c">GitHub repository and CI (GitHub Actions)</text><circle cx="394" cy="866" r="3.5" fill="#dc2626"/><text x="406" y="872" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Parity test: WebAssembly = native gfortran</text><text x="406" y="900" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">in 20 cases; = reference tables in 13</text><circle cx="394" cy="922" r="3.5" fill="#dc2626"/><text x="406" y="928" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#4b5563">Server test: real ELSEPA, no silent fallback</text><path d="M300,495 L368,495" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="334" y="482" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">uses</text><path d="M1108,175 L1032,175" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><text x="1070" y="162" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">HTTPS</text><path d="M1032,435 L1108,435" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="1070" y="422" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">/api/*</text><path d="M1108,690 L1032,690" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)"/><text x="1070" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">upload</text><path d="M700,798 L700,732" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><text x="790" y="772" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">tests every change</text><path d="M30,700 L90,700" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><text x="102" y="706" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#4b5563">always used</text><path d="M30,734 L90,734" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)"/><text x="102" y="740" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#4b5563">optional, or only when</text><text x="102" y="762" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#4b5563">available or selected</text></svg>