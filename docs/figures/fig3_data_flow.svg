<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800.0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">Data flow of a simulation request</text><rect x="30" y="380" width="230" height="170" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="48" y="414" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#0f172a">1  Set parameters</text><circle cx="54" cy="446" r="3.5" fill="#334155"/><text x="66" y="452" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">React interface</text><rect x="300" y="380" width="250" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="318" y="414" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#1d4ed8">2  API request</text><circle cx="324" cy="446" r="3.5" fill="#2563eb"/><text x="336" y="452" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">/api/simulate,</text><text x="336" y="480" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">-molecule, -sweep,</text><text x="336" y="508" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">batch-simulate</text><path d="M260,465 L298,465" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><path d="M690,355 L800,465 L690,575 L580,465 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="690" y="447" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#1d4ed8">3  Router</text><text x="690" y="475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#4b5563">server with</text><text x="690" y="499" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#4b5563">native ELSEPA?</text><path d="M550,465 L578,465" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><rect x="860" y="140" width="330" height="180" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="10 7"/><text x="878" y="174" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#b45309">Server (optional)</text><circle cx="884" cy="206" r="3.5" fill="#d97706"/><text x="896" y="212" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">Express → gfortran</text><text x="896" y="240" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">ELSCATA / ELSCATM</text><circle cx="884" cy="262" r="3.5" fill="#d97706"/><text x="896" y="268" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">Runs in a temp folder</text><rect x="860" y="610" width="330" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="878" y="644" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#047857">Browser</text><circle cx="884" cy="676" r="3.5" fill="#059669"/><text x="896" y="682" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">ELSEPA WebAssembly</text><text x="896" y="710" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">in a Web Worker</text><circle cx="884" cy="732" r="3.5" fill="#059669"/><text x="896" y="738" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">Fresh module per run</text><path d="M690,355 L690,220 L858,220" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)"/><text x="760" y="207" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">yes</text><path d="M690,575 L690,710 L858,710" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><text x="760" y="697" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">no</text><path d="M1025,320 L1025,608" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)"/><text x="1080" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">server error</text><text x="1080" y="472" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke">(HTTP 5xx)</text><rect x="1240" y="380" width="320" height="170" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="1258" y="414" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#047857">4  ELSEPA output</text><circle cx="1264" cy="446" r="3.5" fill="#059669"/><text x="1276" y="452" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">dcs_*.dat, scatamp.dat,</text><text x="1276" y="480" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">scfield.dat, dpwa.dat</text><path d="M1190,220 L1400,220 L1400,378" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1190,710 L1400,710 L1400,552" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1240" y="830" width="320" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="1258" y="864" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#1d4ed8">5  Parse to JSON</text><circle cx="1264" cy="896" r="3.5" fill="#2563eb"/><text x="1276" y="902" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">SimulationResult</text><path d="M1500,552 L1500,828" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><rect x="860" y="830" width="330" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="878" y="864" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#1d4ed8">6  Visualize</text><circle cx="884" cy="896" r="3.5" fill="#2563eb"/><text x="896" y="902" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">DCS, Sherman, polar plot,</text><text x="896" y="930" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">potentials, phase shifts</text><path d="M1238,900 L1192,900" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><rect x="400" y="830" width="410" height="140" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="418" y="864" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#6d28d9">7  Keep and share</text><circle cx="424" cy="896" r="3.5" fill="#7c3aed"/><text x="436" y="902" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">Save run (localStorage), overlay</text><text x="436" y="930" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">data, export CSV / JSON</text><path d="M858,900 L812,900" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="120" width="520" height="180" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/><text x="48" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#b91c1c">Errors are reported, not hidden</text><circle cx="54" cy="186" r="3.5" fill="#dc2626"/><text x="66" y="192" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">If ELSEPA cannot run (e.g. E &lt; 10 eV), the</text><text x="66" y="220" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">user sees the error; no approximate</text><text x="66" y="248" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">result is substituted</text><rect x="30" y="620" width="520" height="170" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="48" y="654" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#0f172a">Energy sweep and batch runs</text><circle cx="54" cy="686" r="3.5" fill="#334155"/><text x="66" y="692" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">Steps 3–5 repeat for each energy</text><text x="66" y="720" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#4b5563">(16 energies, 10 eV–1 MeV) or atom</text><text x="30" y="990" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#4b5563" font-style="italic">The TS approximation is used only when the user selects it, and its results are flagged.</text><path d="M870,100 L930,100" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><text x="942" y="106" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#4b5563">always used</text><path d="M1090,100 L1150,100" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)"/><text x="1162" y="106" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#4b5563">optional / only when available or selected</text></svg>