<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Simplified High-Contrast 16x16 Favicon -->
  <rect width="16" height="16" rx="3.5" fill="#090D16" />
  
  <g transform="translate(8, 8)">
    <!-- Arc -->
    <path d="M 0 -5.5 A 5.5 5.5 0 1 0 0 5.5" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round" />

    <!-- Lobe -->
    <path d="M 0 0 C 1.5 -3.8, 6.5 -4, 6.5 0 C 6.5 4, 1.5 3.8, 0 0 Z" fill="#7C3AED" stroke="#A78BFA" stroke-width="0.8" />

    <!-- Electron & Target -->
    <circle cx="-3.5" cy="0" r="1.3" fill="#60A5FA" />
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
