<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#6366f1" stroke-width="3"/>
  <!-- Target nucleus -->
  <circle cx="50" cy="50" r="10" fill="#818cf8"/>
  <circle cx="50" cy="50" r="5" fill="#38bdf8"/>
  <!-- Orbital arcs / scattering pattern -->
  <path d="M 50 15 A 35 35 0 0 1 85 50 A 35 35 0 0 1 50 85" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4 3"/>
  <!-- Incoming electron beam -->
  <line x1="8" y1="50" x2="40" y2="50" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="40,46 48,50 40,54" fill="#38bdf8"/>
  <!-- Scattered trajectories -->
  <path d="M 50 50 Q 70 30 90 20" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 50 50 Q 75 50 92 50" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 50 50 Q 70 70 90 80" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Electron label e- -->
  <circle cx="16" cy="50" r="7" fill="#2563eb"/>
  <text x="16" y="53" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">e⁻</text>
</svg>
